<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Artist 002 composite review</title>
  <style>
    * { box-sizing: border-box; }
    html, body, main { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #080a0e; }
    main { position: relative; isolation: isolate; }
    img { display: block; image-rendering: pixelated; }
    .full {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .station {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: -9%;
      width: min(88vw, 1320px);
      max-height: 82vh;
      object-fit: contain;
      transform: translateX(-50%);
      transform-origin: bottom center;
    }
    .foreground { z-index: 3; }
    @media (max-aspect-ratio: 16 / 9) {
      .station { width: min(94vw, 1320px); }
    }
    @media (min-aspect-ratio: 2 / 1) {
      .station { width: min(76vw, 1320px); max-height: 92vh; bottom: -16%; }
    }
  </style>
</head>
<body>
  <main id="scene"></main>
  <script>
    const root = '../../../../public/assets/core/';
    const scenes = {
      interior: [
        ['background/shop-backwall-night.jpg', 'full'],
        ['background/bg-seating-6.png', 'full'],
        ['background/shop-foreground-frame.png', 'full foreground']
      ],
      station: [
        ['background/shop-backwall-night.jpg', 'full'],
        ['stations/st-drink-beer-tier-1.png', 'station']
      ],
      exteriorClosed: [['background/bg-exterior-s0-closed.jpg', 'full']],
      exteriorOpen: [['background/bg-exterior-s1-open.jpg', 'full']]
    };
    const name = new URLSearchParams(location.search).get('scene') || 'interior';
    const selected = scenes[name] || scenes.interior;
    const container = document.querySelector('#scene');
    for (const [path, className] of selected) {
      const image = document.createElement('img');
      image.src = root + path;
      image.className = className;
      image.alt = '';
      container.append(image);
    }
  </script>
</body>
</html>
