server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index public-shell.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = / {
    try_files /public-shell.html =404;
  }

  # 개발 서버 시절의 공개 URL과 저장된 북마크를 정적 배포에서도 유지한다.
  location /src/ {
    rewrite ^/src/(.*)$ /$1 last;
  }

  location /public/ {
    rewrite ^/public/(.*)$ /$1 last;
  }

  location /assets/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
