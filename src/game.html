<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YAKI SEASON — 영업 화면</title>
<link rel="stylesheet" href="./game.css">
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js" } }
</script>
</head>
<body>
  <canvas id="scene" data-testid="scene-canvas"></canvas>

  <!-- 더미 오브젝트 이름표 (아트 전 식별용, DOM 오버레이) -->
  <div id="labelLayer" class="label-layer" data-testid="label-layer"></div>

  <!-- 손님 좌석 말풍선·대기 게이지 (DOM 오버레이, UI-003 §51) -->
  <div id="bubbleLayer" class="bubble-layer" data-testid="bubble-layer"></div>

  <!-- 영업 공통 shell (UI-003 §321) -->
  <header id="svcBar" data-testid="svc-bar">
    <span id="svcStation" class="svc-station" data-testid="svc-station">손님</span>
    <ol id="receipts" class="receipts" data-testid="svc-receipts" aria-label="주문서"></ol>
    <button id="endDay" class="end-day" data-testid="end-day" type="button">영업 종료</button>
  </header>

  <!-- 정산 (SCR-POST-SETTLEMENT) -->
  <div id="settlement" class="settlement" data-testid="settlement" hidden>
    <div class="settle-card">
      <h2>영업 종료 · 정산</h2>
      <ul class="settle-rows">
        <li><span>방문 손님</span><b data-f="visited">0</b></li>
        <li><span>제공 완료</span><b data-f="served">0</b></li>
        <li><span>이탈</span><b data-f="lost">0</b></li>
        <li><span>품질 (좋음 · 과다)</span><b><span data-f="good">0</span> · <span data-f="low">0</span></b></li>
        <li><span>매출</span><b data-f="revenue">0</b></li>
        <li><span>팁</span><b data-f="tip">0</b></li>
        <li class="total"><span>합계</span><b data-f="total">0</b></li>
        <li><span>평균 만족도</span><b data-f="avgSatisfaction">0</b></li>
      </ul>
      <button id="nextDay" class="next-day" data-testid="next-day" type="button">다음 날</button>
    </div>
  </div>

  <div id="hint" class="hint" data-testid="hint"></div>

  <!-- 좌·우 인접 전환 (svc.sideNav) -->
  <button id="navLeft" class="side-nav left" data-testid="nav-left" aria-label="이전 화면">‹</button>
  <button id="navRight" class="side-nav right" data-testid="nav-right" aria-label="다음 화면">›</button>

  <!-- 드링크: 잔 채움·기준선·결과 (DOM, 드링크 화면 전용) -->
  <div id="drinkPanel" class="drink-panel" data-testid="drink-panel" hidden>
    <div class="glass" data-testid="drink-glass">
      <span class="foam" data-testid="drink-foam"></span>
      <span class="beer" data-testid="drink-beer"></span>
      <span class="target-line"></span>
      <span class="stamp" data-testid="drink-stamp" hidden></span>
    </div>
    <p class="drink-hint">레버 <b>아래</b>=맥주 · <b>위</b>=거품 (눌러서 채우기)</p>
    <div class="drink-actions">
      <button data-act="finish" data-testid="drink-finish">완성</button>
    </div>
    <div class="drink-overflow" data-testid="drink-overflow" hidden>
      <span>잔이 넘쳤어요</span>
      <button data-act="serve-low" data-testid="drink-serve-low">낮은 품질로 제공</button>
      <button data-act="discard" data-testid="drink-discard">폐기</button>
    </div>
  </div>

  <!-- 공용 준비 목록 (svc.preparedDock) — 완성품 선반, 전 화면 공유 -->
  <div id="dockShelf" class="dock-shelf" data-testid="dock-shelf" aria-label="공용 준비 목록" hidden></div>

  <!-- 퀵 전환 (svc.quickNav) -->
  <nav id="quickNav" class="quick-nav" data-testid="quick-nav" aria-label="화면 빠른 전환"></nav>

  <div id="resultOverlay" class="overlay" data-testid="result-overlay" hidden>
    <p id="resultMessage" data-testid="result-message"></p>
    <button id="restartButton" data-testid="restart-button">한 번 더 만들기</button>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
