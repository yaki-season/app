<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YAKI SEASON — D1 전체 영업</title>
<link rel="stylesheet" href="./game.css">
<link rel="stylesheet" href="./d1-game.css">
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js" } }
</script>
</head>
<body>
  <canvas id="scene" data-testid="scene-canvas"></canvas>

  <!-- 더미 오브젝트 이름표 (아트 전 스테이션 식별용) -->
  <div id="labelLayer" class="label-layer" data-testid="label-layer"></div>

  <!-- D1BusinessDayUiPort의 6석 상태를 투영하는 말풍선·대기 게이지 -->
  <div id="bubbleLayer" class="bubble-layer" data-testid="bubble-layer"></div>

  <!-- 현재 해금된 그릴 칸의 접촉면·양면 누적·현재 행동을 읽는 semantic DOM -->
  <section
    id="grillStatusLayer"
    class="grill-status-layer"
    data-testid="grill-status-layer"
    aria-label="그릴 꼬치 면별 누적 상태"
    aria-live="polite"
    hidden
  ></section>

  <!-- 영업 공통 shell -->
  <header id="svcBar" data-testid="svc-bar">
    <span id="svcStation" class="svc-station" data-testid="svc-station">손님</span>
    <ol id="receipts" class="receipts" data-testid="svc-receipts" aria-label="조립 진행"></ol>
    <span id="orderHud" class="order-hud" data-testid="order-hud"></span>
    <span id="businessClock" class="business-clock" data-testid="business-clock">17:30</span>
    <span id="businessPhase" class="business-phase" data-testid="business-phase">준비</span>
  </header>

  <!-- D1 첫 주문 필수 단계 목록·현재 단계·다음 행동은 도움 설정과 무관하게 상시 유지한다. -->
  <section id="guide" class="d1-guide" data-testid="d1-guide" aria-labelledby="guideTitle" data-expanded="false">
    <div class="d1-guide-head">
      <strong id="guideTitle">첫 주문 · 총 3항목</strong>
      <span id="guideCurrent" data-testid="guide-current"></span>
      <button id="guideToggle" class="d1-guide-toggle" type="button" aria-expanded="false" aria-controls="guideSteps">전체 보기</button>
    </div>
    <p id="guideNextAction" data-testid="guide-next-action" aria-live="polite"></p>
    <ol id="guideSteps" data-testid="guide-steps"></ol>
  </section>

  <!-- 좌·우 인접 전환 -->
  <button id="navLeft" class="side-nav left" data-testid="nav-left" aria-label="이전 화면">‹</button>
  <button id="navRight" class="side-nav right" data-testid="nav-right" aria-label="다음 화면">›</button>

  <!-- 그릴 전용 재고 UI. 생꼬치는 한 장의 카드로 배치하고 완성품은 공용 준비 목록을 읽기 전용으로 투영한다. -->
  <section
    id="grillInventory"
    class="grill-inventory"
    data-testid="grill-inventory"
    aria-label="그릴 재고"
    hidden
  >
    <article class="grill-inventory-panel grill-inventory-panel--raw" aria-labelledby="grillRawInventoryTitle">
      <header class="grill-inventory-heading">
        <span>굽기 전</span>
        <strong id="grillRawInventoryTitle">생꼬치 재고</strong>
      </header>
      <button
        id="grillWaitingNegima"
        class="grill-waiting-negima"
        type="button"
        data-testid="grill-waiting-negima"
        aria-describedby="grillWaitingNegimaHint"
      >
        <span class="grill-skewer-symbol" aria-hidden="true"><i></i><b></b><b></b><b></b></span>
        <span class="grill-inventory-card-copy">
          <span class="grill-inventory-card-title">
            <strong>네기마</strong>
            <span id="grillWaitingNegimaCount" class="grill-inventory-count">× 0</span>
          </span>
          <span id="grillWaitingNegimaHint">대기 중인 꼬치가 없습니다</span>
        </span>
      </button>
    </article>

    <article class="grill-inventory-panel grill-inventory-panel--finished" aria-labelledby="grillFinishedInventoryTitle">
      <header class="grill-inventory-heading">
        <span>굽기 완료</span>
        <strong id="grillFinishedInventoryTitle">완성 네기마</strong>
        <span id="grillFinishedInventoryCount" class="grill-inventory-total">총 0개</span>
      </header>
      <div
        id="grillFinishedQualityList"
        class="grill-finished-quality-list"
        data-testid="grill-finished-quality-list"
        role="list"
        aria-live="polite"
      ></div>
    </article>
  </section>

  <!-- 드링크: 잔 채움·기준선·결과 -->
  <div id="drinkPanel" class="drink-panel" data-testid="drink-panel" hidden>
    <div class="glass" data-testid="drink-glass">
      <span class="foam" data-testid="drink-foam"></span>
      <span class="beer" data-testid="drink-beer"></span>
      <span class="target-line"></span>
      <span class="stamp" data-testid="drink-stamp" hidden></span>
    </div>
    <p class="drink-hint">레버 <b>아래</b>=맥주 · <b>위</b>=거품 (눌러서 채우기)</p>
    <div class="drink-actions">
      <button data-act="finish" data-testid="drink-finish">완성</button>
    </div>
    <div class="drink-overflow" data-testid="drink-overflow" hidden>
      <span>잔이 넘쳤어요</span>
      <button data-act="serve-low" data-testid="drink-serve-low">낮은 품질로 제공</button>
      <button data-act="discard" data-testid="drink-discard">폐기</button>
    </div>
  </div>

  <!-- 공용 준비 목록 (완성품 선반) -->
  <div id="dockShelf" class="dock-shelf" data-testid="dock-shelf" aria-label="공용 준비 목록" hidden></div>

  <button id="momoPrep" class="momo-prep" type="button" data-testid="momo-prep" hidden>
    모모 꼬치 준비
  </button>

  <section id="d3TorchPanel" class="d3-torch-panel" data-testid="d3-torch-panel" data-state-id="D3-MOMO-TARE-READY" aria-labelledby="d3TorchTitle" hidden>
    <div class="d3-torch-head">
      <strong id="d3TorchTitle">타레 모모 · 토치 마감</strong>
      <span id="d3TorchState" data-testid="d3-torch-state" data-component-id="grill.torchState" data-required-asset-id="UI-TORCH-STATE-D3" aria-live="polite">타레 대기</span>
    </div>
    <button id="d3ApplyTare" type="button" data-testid="d3-apply-tare" data-component-id="grill.tare.apply" data-required-asset-id="PROP-TARE-BRUSH-D3">타레 바르기</button>
    <button
      id="d3TorchTrack"
      class="d3-torch-track"
      type="button"
      data-testid="d3-torch-track"
      data-component-id="grill.torch"
      data-required-asset-id="MDL-GRILL-TORCH"
      aria-describedby="d3TorchHelp d3TorchWarning"
    >
      <span id="d3TorchFill" class="d3-torch-fill" data-component-id="grill.torch.flame" data-required-asset-id="VFX-TORCH-FLAME"></span>
      <span class="d3-torch-label">누른 채 좌우로 훑기</span>
    </button>
    <div class="d3-torch-meter" role="progressbar" aria-label="토치 적용 범위" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span id="d3TorchCoverage" data-component-id="grill.torchCoverage" data-required-asset-id="UI-TORCH-COVERAGE-D3"></span>
    </div>
    <p id="d3TorchHelp">키보드: Space로 토치를 켠 채 ← →로 이동</p>
    <p id="d3TorchWarning" class="d3-torch-warning" data-component-id="grill.torchFocusWarning" data-required-asset-id="UI-TORCH-FOCUS-WARN-D3" aria-live="assertive"></p>
    <button id="d3RetrieveMomo" type="button" data-testid="d3-retrieve-momo" disabled>완성품 회수</button>
  </section>

  <!-- 선택 완성품과 일치하는 모든 손님을 포인터·키보드 대상으로 제공 -->
  <section
    id="customerServePanel"
    class="customer-serve-panel"
    data-testid="customer-serve-panel"
    aria-labelledby="customerServeTitle"
    hidden
  >
    <div class="customer-serve-heading">
      <h2 id="customerServeTitle">손님별 남은 주문</h2>
      <p id="selectedPreparedItem" aria-live="polite">완성품을 선택하세요</p>
    </div>
    <div id="customerServeTargets" class="customer-serve-targets"></div>
  </section>

  <section id="serveQuantity" class="serve-quantity" data-testid="serve-quantity" aria-labelledby="serveQuantityTitle" hidden>
    <strong id="serveQuantityTitle">제공 수량 선택</strong>
    <p id="serveQuantitySummary"></p>
    <div>
      <button type="button" data-act="serve-one" data-testid="serve-one">1개만 제공</button>
      <button type="button" data-act="serve-all" data-testid="serve-all">다 주기</button>
      <button type="button" data-act="serve-cancel" data-testid="serve-cancel">취소</button>
    </div>
  </section>

  <!-- 퀵 전환 -->
  <nav id="quickNav" class="quick-nav" data-testid="quick-nav" aria-label="화면 빠른 전환"></nav>

  <div id="hint" class="hint" data-testid="hint"></div>

  <!-- 마감·숯불·5단계 정산. 정식 아트가 오기 전 stable ID 기반 개발 placeholder. -->
  <section
    id="postBusinessPanel"
    class="post-business-panel"
    data-testid="post-business-panel"
    data-component-id="closing.charcoal"
    data-required-asset-id="ST-CHARCOAL-CORE"
    data-placeholder="development"
    hidden
  >
    <p id="postBusinessTitle" class="post-business-title" data-testid="post-business-title"></p>
    <p id="postBusinessSummary" class="post-business-summary" data-testid="post-business-summary"></p>
    <ol id="settlementSteps" class="settlement-steps" data-testid="settlement-steps"></ol>
    <button id="postBusinessAction" type="button" data-testid="post-business-action"></button>
  </section>

  <!-- 완료 오버레이: day-complete 저장 성공 뒤 D2 pre-open -->
  <div id="resultOverlay" class="overlay" data-testid="result-overlay" hidden>
    <p id="resultMessage" data-testid="result-message"></p>
    <a id="continueButton" class="continue-button" data-testid="continue-button" href="./s0-d3.html">D2로 계속</a>
  </div>

  <script type="module" src="./d1-game.js"></script>
</body>
</html>
