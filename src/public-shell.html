<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17100d">
  <title>YAKI SEASON</title>
  <link rel="stylesheet" href="./public-shell.css">
</head>
<body data-screen-id="SCR-SYS-BOOT">
  <a class="skip-link" href="#shell-screen">본문으로 건너뛰기</a>
  <main id="public-shell" class="public-shell" data-testid="public-shell" aria-busy="true">
    <header class="shell-header">
      <div>
        <p class="eyebrow">PUBLIC WEB SHELL</p>
        <p class="brand" aria-label="YAKI SEASON">YAKI <span>SEASON</span></p>
      </div>
      <div class="header-actions">
        <button id="pause-button" type="button">일시정지</button>
        <button id="refresh-button" type="button">새 버전 확인</button>
      </div>
    </header>

    <section id="shell-screen" class="shell-screen" tabindex="-1" aria-live="polite">
      <p class="loading-label">저장 상태 확인 중…</p>
    </section>

    <footer class="shell-footer">
      <span>정적 웹 · 로컬 저장만 사용</span>
      <span>원격 수집·클라우드·오디오 없음</span>
    </footer>
  </main>

  <input id="save-file-input" type="file" accept="application/json,.json" hidden>
  <dialog id="shell-dialog" aria-labelledby="dialog-title">
    <div class="dialog-frame">
      <p id="dialog-kicker" class="eyebrow"></p>
      <h2 id="dialog-title"></h2>
      <div id="dialog-content" class="dialog-content"></div>
      <div id="dialog-actions" class="dialog-actions"></div>
    </div>
  </dialog>

  <noscript>
    <section class="fatal-boot"><h1>JavaScript가 필요합니다</h1><p>브라우저에서 JavaScript를 켠 뒤 다시 시도해 주세요.</p></section>
  </noscript>
  <script type="module">
    import('./public-shell.js')
      .then(({ bootPublicShell }) => bootPublicShell())
      .catch((error) => {
        document.body.dataset.screenId = 'SCR-SYS-RECOVERY';
        const screen = document.querySelector('#shell-screen');
        screen.replaceChildren();
        const title = document.createElement('h1');
        title.textContent = '필수 파일을 불러오지 못했습니다';
        const message = document.createElement('p');
        message.textContent = '연결을 확인한 뒤 새 버전 확인을 눌러 다시 시도해 주세요.';
        const retry = document.createElement('button');
        retry.type = 'button';
        retry.textContent = '새 버전 확인';
        retry.addEventListener('click', () => location.reload());
        screen.append(title, message, retry);
        document.querySelector('#public-shell').setAttribute('aria-busy', 'false');
        console.error('PUBLIC_SHELL_BOOT_FAILED', error?.name);
      });
  </script>
</body>
</html>
