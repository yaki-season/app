<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YAKI SEASON — S0 외관 상태별 배경 재조립</title>
  <link rel="stylesheet" href="./s0-exterior-background-harness.css">
</head>
<body>
  <main class="harness">
    <section id="logical-stage" class="logical-stage" data-testid="logical-stage" aria-labelledby="harness-title">
      <div id="art-camera" class="art-camera" data-testid="art-camera" aria-hidden="true">
        <div class="exterior-guide"></div>
        <img id="approved-asset" class="approved-asset" alt="" hidden>
        <div id="asset-placeholder" class="asset-placeholder">
          <span>개발 중</span>
          <strong id="asset-id"></strong>
        </div>
      </div>
      <div id="semantic-dom" class="semantic-dom" data-testid="semantic-dom">
        <header class="contract-label">
          <p>shared background binding <span id="contract-version"></span></p>
          <h1 id="harness-title">S0 외관</h1>
          <p id="source-master"></p>
        </header>
        <button class="skip" type="button">건너뛰기</button>
        <section id="dom-safe" class="dom-safe" aria-label="프롤로그 상태">
          <p id="state-identity"></p>
          <button id="state-action" type="button"></button>
        </section>
      </div>
    </section>
  </main>
  <script type="module" src="./s0-exterior-background-harness.js"></script>
</body>
</html>
