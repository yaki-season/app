<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17100d">
  <title>YAKI SEASON — D1 첫 주문 (2.5D)</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/yaki-season-icon-r3-192.png">
  <link rel="apple-touch-icon" href="/yaki-season-icon-r3-512.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="./presentation/styles/pages/d1.css">
  <link rel="stylesheet" href="./presentation/styles/pages/d1-scene.css">
  <script type="importmap">
  { "imports": { "three": "/node_modules/three/build/three.module.js" } }
  </script>
</head>
<body>
  <!-- 2.5D 손님 장면: 배경·손님·카운터를 깊이 평면으로 합성 (Three.js 단일 렌더러). -->
  <canvas id="scene-canvas" class="scene-canvas" data-testid="scene-canvas" aria-hidden="true"></canvas>

  <main class="d1-screen" data-testid="d1-screen">
    <header class="order-panel" aria-labelledby="order-title">
      <p class="eyebrow">좌석 01 · D1-ORDER-001</p>
      <h1 id="order-title">츠키오카의 첫 주문</h1>
      <p id="customer-state" data-testid="customer-state" aria-live="polite"></p>
      <ul id="order-items" class="order-items" aria-label="주문 항목"></ul>
    </header>

    <section class="workspace" aria-label="D1 조리와 제공">
      <section id="scene-status" class="scene-status" data-testid="d1-scene-status" aria-live="polite">
        <strong id="scene-title">승인 runtime 아트 확인 중</strong>
        <span class="development-label">개발 중</span>
        <p id="scene-description">manifest ID를 검증하고 있습니다.</p>
      </section>
      <div id="controls" class="controls" data-testid="d1-controls"></div>
      <section class="prepared" aria-labelledby="prepared-title">
        <h2 id="prepared-title">공용 준비 목록</h2>
        <div id="prepared-list" class="prepared-list" data-testid="prepared-list"></div>
      </section>
    </section>

    <output id="state-output" class="sr-only" data-testid="d1-state-output"></output>
  </main>
  <script type="module" src="./d1-scene.js"></script>
</body>
</html>
