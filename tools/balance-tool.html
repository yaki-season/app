<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밸런스 튜닝 도구 — YAKI SEASON</title>
<style>
  :root {
    --bg:#17120e; --surface:#201a15; --surface-2:#29211a; --line:#362b21;
    --text:#f2e9df; --dim:#a9998a; --dimmer:#7d6f63;
    --ember:#ff7d33; --ok:#7fc47a; --warn:#e8b04a; --crit:#ef5a48;
    --mono: ui-monospace, "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;
    --ui: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--text); font:14px/1.5 var(--ui); }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12px; margin:0 0 18px; }
  .status-badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px;
    border:1px solid var(--warn); color:var(--warn); vertical-align:middle; margin-left:8px; }
  .wrap { display:grid; grid-template-columns: minmax(360px, 1fr) minmax(320px, 1fr); gap:20px; align-items:start; }
  @media (max-width: 860px) { .wrap { grid-template-columns:1fr; } }

  .panel { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .panel h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--dim); margin:0 0 12px; }

  .group { margin-bottom:16px; }
  .group-name { font-size:12px; color:var(--ember); margin:0 0 8px; font-weight:600; }
  .row { display:grid; grid-template-columns: 120px 1fr 78px; gap:10px; align-items:center; margin-bottom:8px; }
  .row.changed .rlabel::after { content:" ●"; color:var(--ember); }
  .rlabel { font-size:12px; color:var(--text); }
  input[type=range] { width:100%; accent-color:var(--ember); }
  .rval { font:12px var(--mono); text-align:right; color:var(--text); }
  .rval .unit { color:var(--dimmer); font-size:10px; }

  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  button { font:13px var(--ui); color:var(--text); background:var(--surface-2); border:1px solid var(--line);
    border-radius:8px; padding:8px 14px; cursor:pointer; }
  button:hover { border-color:var(--ember); }
  button.primary { background:var(--ember); color:#1a120a; border-color:var(--ember); font-weight:600; }
  .seed { display:flex; align-items:center; gap:6px; margin-left:auto; color:var(--dim); font-size:12px; }
  .seed input { width:64px; font:12px var(--mono); background:var(--surface-2); color:var(--text);
    border:1px solid var(--line); border-radius:6px; padding:4px 6px; }

  .metrics { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px; }
  .metric { background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .metric .k { font-size:11px; color:var(--dim); }
  .metric .v { font:20px/1.2 var(--mono); margin-top:2px; }
  .metric .delta { font:11px var(--mono); margin-left:6px; }
  .delta.up { color:var(--ok); } .delta.down { color:var(--crit); } .delta.flat { color:var(--dimmer); }

  .quality-bar { height:14px; border-radius:999px; overflow:hidden; display:flex; border:1px solid var(--line); margin-top:6px; }
  .quality-bar .good { background:var(--ok); } .quality-bar .low { background:var(--warn); }
  .legend { font-size:11px; color:var(--dim); margin-top:6px; display:flex; gap:14px; }
  .legend b { color:var(--text); font-weight:600; }
  .hint { color:var(--dimmer); font-size:11px; margin-top:14px; line-height:1.6; }
  .empty { color:var(--dimmer); font-size:13px; padding:20px 0; text-align:center; }
  #error { color:var(--crit); font-size:12px; margin-top:8px; white-space:pre-wrap; }
</style>
</head>
<body>
  <h1>밸런스 튜닝 도구 <span class="status-badge" id="statusBadge">candidate</span></h1>
  <p class="sub">수치를 조절하고 한 영업일을 시뮬레이션해 결과를 본다. 저장 형식은 JSON, 값은 <code>candidate</code>다 · SYS-005</p>

  <div class="wrap">
    <div class="panel">
      <h2>수치</h2>
      <div id="controls"></div>
      <div class="toolbar">
        <button class="primary" id="run">▶ 시뮬레이션 실행</button>
        <button id="reset">되돌리기</button>
        <button id="export">JSON 내보내기</button>
        <label class="seed">시드 <input type="number" id="seed" value="1" min="0"></label>
      </div>
      <div id="error"></div>
    </div>

    <div class="panel">
      <h2>영업일 결과</h2>
      <div id="result"><p class="empty">시뮬레이션을 실행하세요.</p></div>
      <p class="hint" id="hint"></p>
    </div>
  </div>

  <script type="module">
    import { runBusinessDay } from './simulator.js';

    const $ = (id) => document.getElementById(id);
    let data = null;      // 현재 편집 중
    let original = null;  // 원본 (되돌리기용)
    let prev = null;      // 직전 실행 결과 (비교용)

    function clone(x) { return JSON.parse(JSON.stringify(x)); }

    async function load() {
      try {
        const res = await fetch('./balance-data.json');
        if (!res.ok) throw new Error('balance-data.json 로드 실패 (' + res.status + ')');
        data = await res.json();
        original = clone(data);
        $('statusBadge').textContent = data.status || 'candidate';
        renderControls();
      } catch (e) {
        $('error').textContent = e.message + '\n로컬 서버로 열어야 합니다: npm run dev → /tools/balance-tool.html';
      }
    }

    function renderControls() {
      const box = $('controls');
      box.innerHTML = '';
      for (const [gname, fields] of Object.entries(data.groups)) {
        const g = document.createElement('div');
        g.className = 'group';
        g.innerHTML = `<p class="group-name">${gname}</p>`;
        for (const [key, f] of Object.entries(fields)) {
          const row = document.createElement('div');
          row.className = 'row';
          row.dataset.g = gname; row.dataset.k = key;
          row.innerHTML = `
            <span class="rlabel">${f.label}</span>
            <input type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${f.value}">
            <span class="rval"><span class="num">${f.value}</span> <span class="unit">${f.unit}</span></span>`;
          const range = row.querySelector('input');
          const num = row.querySelector('.num');
          range.addEventListener('input', () => {
            const val = parseFloat(range.value);
            f.value = val;
            num.textContent = val;
            markChanged(row, gname, key);
          });
          g.appendChild(row);
        }
        box.appendChild(g);
      }
    }

    function markChanged(row, g, k) {
      const changed = data.groups[g][k].value !== original.groups[g][k].value;
      row.classList.toggle('changed', changed);
    }

    function fmt(n) { return n.toLocaleString('ko-KR'); }

    function delta(cur, before, invert = false) {
      if (before === undefined) return '';
      const d = cur - before;
      if (d === 0) return `<span class="delta flat">±0</span>`;
      const good = invert ? d < 0 : d > 0;
      const cls = good ? 'up' : 'down';
      const sign = d > 0 ? '+' : '';
      return `<span class="delta ${cls}">${sign}${fmt(Number(d.toFixed(1)))}</span>`;
    }

    function renderResult(r) {
      const goodPct = r.served ? Math.round((r.good / r.served) * 100) : 0;
      const lowPct = 100 - goodPct;
      const m = (k, key, unit = '', invert = false) =>
        `<div class="metric"><div class="k">${k}</div><div class="v">${fmt(r[key])}${unit}${delta(r[key], prev?.[key], invert)}</div></div>`;

      $('result').innerHTML = `
        <div class="metrics">
          ${m('총 수익 (매출+팁)', 'total', ' G')}
          ${m('서빙 완료', 'served', ' 명')}
          ${m('손님 이탈', 'left', ' 명', true)}
          ${m('평균 대기', 'avgWaitSec', ' 초', true)}
          ${m('매출', 'revenue', ' G')}
          ${m('팁', 'tip', ' G')}
        </div>
        <div style="margin-top:12px">
          <div class="k" style="font-size:11px;color:var(--dim)">품질 분포 (서빙 ${r.served}명 중)</div>
          <div class="quality-bar">
            <div class="good" style="width:${goodPct}%"></div>
            <div class="low" style="width:${lowPct}%"></div>
          </div>
          <div class="legend">
            <span><b>좋음</b> ${r.good}명 (${goodPct}%)</span>
            <span><b>낮음</b> ${r.low}명 (${lowPct}%)</span>
          </div>
        </div>`;
      $('hint').textContent =
        `주문당 조리 ${r.cookTimePerOrderSec}초 · 손님 ${r.customers}명 · 이탈률 ${Math.round(r.leaveRate * 100)}%. ` +
        `초록/빨강 화살표는 직전 실행 대비 변화입니다.`;
    }

    $('run').addEventListener('click', () => {
      $('error').textContent = '';
      try {
        const seed = parseInt($('seed').value, 10) || 0;
        const r = runBusinessDay(data, seed);
        renderResult(r);
        prev = r;
      } catch (e) {
        $('error').textContent = e.message;
      }
    });

    $('reset').addEventListener('click', () => {
      data = clone(original);
      renderControls();
    });

    $('export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'balance-data.json';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    load();
  </script>
</body>
</html>
