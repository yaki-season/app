<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    img { width: 100%; height: 100%; display: block; object-fit: fill; image-rendering: pixelated; }
  </style>
</head>
<body>
  <img id="source" alt="">
  <script>
    const source = new URLSearchParams(location.search).get('src');
    if (!source) throw new Error('Missing src query parameter');
    document.querySelector('#source').src = source;
  </script>
</body>
</html>
